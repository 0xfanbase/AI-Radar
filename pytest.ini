[pytest]
markers =
    live: exercises real network calls, excluded by default
addopts = -m "not live" --strict-markers
# Both suites: a bare `python -m pytest` previously collected only
# tests/, silently skipping all of site/tests -- a local footgun against
# CLAUDE.md's "python -m pytest must be green before every commit" rule
# (CI always ran both explicitly, so this was never a CI hole).
testpaths = tests site/tests
